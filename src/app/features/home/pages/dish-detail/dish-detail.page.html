<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-button (click)="goBack()" class="back-button">
                <ion-icon name="arrow-back" slot="icon-only"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <div class="detail-container" *ngIf="dish && !isLoading">
        <!-- Hero Image Section -->
        <div class="hero-section">
            <img [src]="dish.images[selectedImage]" [alt]="dish.name" class="hero-image" />

            <!-- Floating Action Buttons -->
            <div class="floating-actions">
                <button class="favorite-button" (click)="toggleFavorite()" [class.active]="isFavorite">
                    <ion-icon [name]="isFavorite ? 'heart' : 'heart-outline'"></ion-icon>
                </button>
            </div>

            <!-- Availability Badge -->
            <div class="availability-badge" *ngIf="dish.available">
                <ion-badge color="success">Disponible</ion-badge>
            </div>

            <!-- Rating Badge -->
            <div class="rating-badge">
                <ion-icon name="star"></ion-icon>
                <span>{{ dish.rating }}</span>
            </div>

            <!-- Image Thumbnails -->
            <div class="thumbnails-container" *ngIf="dish.images.length > 1">
                <div *ngFor="let image of dish.images; let i = index" class="thumbnail"
                    [class.active]="selectedImage === i" (click)="selectImage(i)">
                    <img [src]="image" [alt]="dish.name" />
                </div>
            </div>
        </div>

        <!-- Content Card -->
        <div class="content-card">
            <!-- Header -->
            <div class="dish-header">
                <div class="title-section">
                    <h1>{{ dish.name }}</h1>
                    <div class="meta-row">
                        <div class="meta-chip">
                            <ion-icon name="time-outline"></ion-icon>
                            <span>{{ dish.preparationTime }} min</span>
                        </div>
                        <div class="meta-chip">
                            <ion-icon name="location-outline"></ion-icon>
                            <span>DarKitchen</span>
                        </div>
                    </div>
                </div>
                <div class="price-section">
                    <span class="currency">$</span>
                    <span class="amount">{{ dish.price }}</span>
                </div>
            </div>

            <!-- Description -->
            <div class="description-card">
                <p>{{ dish.description }}</p>
            </div>

            <!-- Tags -->
            <div class="tags-section" *ngIf="dish.tags && dish.tags.length > 0">
                <ion-chip *ngFor="let tag of dish.tags" class="tag-chip">
                    {{ tag }}
                </ion-chip>
            </div>

            <!-- Quantity Selector -->
            <div class="quantity-card">
                <span class="quantity-label">Cantidad</span>
                <div class="quantity-controls">
                    <button class="qty-button" (click)="decreaseQuantity()" [disabled]="quantity <= 1">
                        <ion-icon name="remove"></ion-icon>
                    </button>
                    <span class="qty-value">{{ quantity }}</span>
                    <button class="qty-button" (click)="increaseQuantity()">
                        <ion-icon name="add"></ion-icon>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div class="loading-container" *ngIf="isLoading">
        <ion-spinner name="crescent"></ion-spinner>
    </div>
</ion-content>

<!-- Fixed Bottom Bar -->
<div class="bottom-bar" *ngIf="dish && !isLoading">
    <div class="total-section">
        <span class="total-label">Total</span>
        <span class="total-amount">\${{ (dish.price * quantity).toFixed(2) }}</span>
    </div>
    <button class="add-button" (click)="addToCart()" [disabled]="!dish.available">
        <ion-icon name="add-circle-outline"></ion-icon>
        <span>Agregar</span>
    </button>
</div>
