<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/darkitchen/dashboard"></ion-back-button>
        </ion-buttons>
        <ion-title>Mis Platillos</ion-title>
        <ion-buttons slot="end">
            <ion-button>
                <ion-icon name="search-outline"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div class="dishes-container" *ngIf="!isLoading">
        <!-- Header Section -->
        <div class="header-section">
            <h2>Menú Digital</h2>
            <p>Administra tus platillos disponibles</p>
        </div>

        <!-- Filter Chips -->
        <div class="filters-section">
            <ion-chip outline>
                <span>🔍</span>
                <ion-label>Todos</ion-label>
            </ion-chip>
            <ion-chip outline>
                <span>🍕</span>
                <ion-label>Pizzas</ion-label>
            </ion-chip>
            <ion-chip outline>
                <span>🍔</span>
                <ion-label>Burgers</ion-label>
            </ion-chip>
            <ion-chip outline>
                <span>🍰</span>
                <ion-label>Postres</ion-label>
            </ion-chip>
        </div>

        <!-- Empty State -->
        <div class="empty-state">
            <ion-icon name="restaurant-outline"></ion-icon>
            <h3>No tienes platillos aún</h3>
            <p>Agrega platillos a tu menú para empezar a vender</p>
            <ion-button class="add-button" routerLink="/darkitchen/dishes/create">
                <ion-icon name="add-circle-outline" slot="start"></ion-icon>
                Agregar Platillo
            </ion-button>
        </div>

        <!-- Dishes List (when there are dishes) -->

    </div>

    <div class="loading-container" *ngIf="isLoading">
        <ion-spinner name="crescent"></ion-spinner>
    </div>

    <!-- FAB Button -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button class="fab-button" routerLink="/darkitchen/dishes/create">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>
