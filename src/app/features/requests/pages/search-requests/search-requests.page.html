<ion-header>
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/home"></ion-back-button>
        </ion-buttons>
        <ion-title>Solicitudes Abiertas</ion-title>
    </ion-toolbar>
    <ion-toolbar>
        <ion-searchbar [(ngModel)]="searchTerm" (ionInput)="onSearchChange()"
            placeholder="Buscar por título o palabra clave" animated></ion-searchbar>
    </ion-toolbar>
</ion-header>

<ion-content>
    <div *ngIf="!isLoading">
        <!-- Darkitchen Selector -->
        <div class="darkitchen-selector ion-padding" *ngIf="myDarkitchens.length > 1">
            <ion-segment [(ngModel)]="selectedDarkitchen" (ionChange)="loadDishes()">
                <ion-segment-button *ngFor="let dk of myDarkitchens" [value]="dk">
                    {{ dk.name }}
                </ion-segment-button>
            </ion-segment>
        </div>

        <!-- Requests List -->
        <div class="requests-list">
            <app-request-card *ngFor="let request of filteredRequests" [request]="request" [showAcceptButton]="true"
                (acceptClick)="onAcceptRequest($event)">
            </app-request-card>

            <div class="empty-state" *ngIf="filteredRequests.length === 0">
                <ion-icon name="search-outline"></ion-icon>
                <h3>No hay solicitudes disponibles</h3>
                <p>No se encontraron solicitudes que coincidan con tu búsqueda</p>
            </div>
        </div>
    </div>

    <div class="loading-container" *ngIf="isLoading">
        <ion-spinner name="crescent"></ion-spinner>
    </div>
</ion-content>
